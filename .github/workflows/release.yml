name: Release

# Releases are numbered like Luau: 0.xxx (three digits), e.g. 0.003, 0.004, ...
#
#   * Push a tag such as 0.003      -> build every platform and publish a release.
#   * Run it by hand (Actions tab)  -> leave "version" empty to use the next
#                                      number automatically. With "publish"
#                                      off (default) it is a dry run that builds
#                                      everything but publishes nothing; with
#                                      "publish" on it creates the tag + release.
#
# The version is baked into the binary (`fenneth --version`) through the
# FENNETH_VERSION environment variable, so Cargo.toml does not need to change.

on:
  push:
    tags: ["0.[0-9][0-9][0-9]"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release number 0.xxx (empty = next number automatically)"
        required: false
        type: string
      publish:
        description: "Publish the release (off = dry run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Number used when no 0.xxx tag exists yet.
  FIRST_VERSION: "0.001"

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="$GITHUB_REF_NAME"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          else
            last="$(git tag --list '0.[0-9][0-9][0-9]' | sort | tail -n 1)"
            if [ -z "$last" ]; then
              v="$FIRST_VERSION"
            else
              v="$(printf '0.%03d' $((10#${last#0.} + 1)))"
            fi
          fi
          if ! [[ "$v" =~ ^0\.[0-9]{3}$ ]]; then
            echo "invalid version '$v': expected 0.xxx with three digits (e.g. 0.003)" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git rev-parse -q --verify "refs/tags/$v" > /dev/null; then
            echo "tag $v already exists" >&2
            exit 1
          fi
          echo "releasing $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      FENNETH_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl builds run on any Linux, including Termux on aarch64.
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="fenneth-${{ matrix.target }}"
          bin=fenneth
          if [ "$RUNNER_OS" = "Windows" ]; then bin=fenneth.exe; fi
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          # The binary must report exactly the release number.
          got="$("dist/$name/$bin" --version)"
          if [ "$got" != "fenneth $FENNETH_VERSION" ]; then
            echo "version mismatch: binary says '$got', expected 'fenneth $FENNETH_VERSION'" >&2
            exit 1
          fi
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Add installers (with this repository baked in)
        run: |
          sed "s#__REPO__#${GITHUB_REPOSITORY}#g" scripts/install.sh > dist/install.sh
          sed "s#__REPO__#${GITHUB_REPOSITORY}#g" scripts/install.ps1 > dist/install.ps1
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true