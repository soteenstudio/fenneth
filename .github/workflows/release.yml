name: Release

# Push a tag like v0.2.0 (it must match `version` in Cargo.toml) to build
# binaries for every platform and publish them, together with the installer
# scripts, as a GitHub Release. Run it by hand (workflow_dispatch) for a dry
# run that builds everything but publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version v$v" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl builds run on any Linux, including Termux on aarch64.
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="fenneth-${{ matrix.target }}"
          bin=fenneth
          if [ "$RUNNER_OS" = "Windows" ]; then bin=fenneth.exe; fi
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp -r examples "dist/$name/examples"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Add installers (with this repository baked in)
        run: |
          sed "s#__REPO__#${GITHUB_REPOSITORY}#g" scripts/install.sh > dist/install.sh
          sed "s#__REPO__#${GITHUB_REPOSITORY}#g" scripts/install.ps1 > dist/install.ps1
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
