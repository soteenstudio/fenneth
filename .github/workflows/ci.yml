name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Docs must exist in both languages (English at /, Indonesian at /id/) and
  # the VitePress site must build, because Vercel builds it from docs/.
  docs:
    name: docs (build + en/id parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: English and Indonesian pages match
        run: sh scripts/check-docs-i18n.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        working-directory: docs
        run: |
          npm install --no-audit --no-fund
          npm run build