[package]
name = "fenneth"
version = "0.2.0"
edition = "2021"
description = "Fenneth: a small statically typed language that compiles to C"
license = "MIT"

[lib]
name = "fenneth"
path = "src/lib.rs"

[[bin]]
name = "fenneth"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
